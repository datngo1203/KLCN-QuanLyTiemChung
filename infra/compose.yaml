services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in infra/.env}
    ports:
      - '127.0.0.1:14333:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  migrate:
    build: &api-build
      context: ..
      dockerfile: backend/Dockerfile
    command: ['--migrate']
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TiemChung: Server=sqlserver;Database=TiemChung;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Catalog__UseDemoData: 'false'
    depends_on:
      sqlserver:
        condition: service_healthy
  api:
    build: *api-build
    ports:
      - '127.0.0.1:5080:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TiemChung: Server=sqlserver;Database=TiemChung;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Catalog__UseDemoData: 'false'
      Identity__SigningKey: ${IDENTITY_SIGNING_KEY:?Set IDENTITY_SIGNING_KEY in infra/.env}
      Identity__MailEncryptionKey: ${IDENTITY_MAIL_ENCRYPTION_KEY:?Set IDENTITY_MAIL_ENCRYPTION_KEY in infra/.env}
      Identity__MailMode: Synthetic
      Identity__DevelopmentMailDirectory: /var/local/klcn-mail
    volumes:
      - type: bind
        source: ${IDENTITY_MAIL_DIRECTORY:?Set absolute IDENTITY_MAIL_DIRECTORY outside Git}
        target: /var/local/klcn-mail
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  sqlserver-data:
