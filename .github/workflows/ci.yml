name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start Compose SQL Server, apply migrations and start database API
        run: |
          export MSSQL_SA_PASSWORD="$(openssl rand -base64 36)Aa1!"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          echo "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" >> "$GITHUB_ENV"
          export IDENTITY_SIGNING_KEY="$(openssl rand -base64 32)"
          export IDENTITY_MAIL_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export IDENTITY_MAIL_DIRECTORY="$(mktemp -d)"
          echo "::add-mask::$IDENTITY_SIGNING_KEY"
          echo "::add-mask::$IDENTITY_MAIL_ENCRYPTION_KEY"
          echo "IDENTITY_SIGNING_KEY=$IDENTITY_SIGNING_KEY" >> "$GITHUB_ENV"
          echo "IDENTITY_MAIL_ENCRYPTION_KEY=$IDENTITY_MAIL_ENCRYPTION_KEY" >> "$GITHUB_ENV"
          echo "IDENTITY_MAIL_DIRECTORY=$IDENTITY_MAIL_DIRECTORY" >> "$GITHUB_ENV"
          echo "M1_SQL_TEST_CONNECTION=Server=localhost,14333;User ID=sa;Password=$MSSQL_SA_PASSWORD;TrustServerCertificate=true" >> "$GITHUB_ENV"
          docker compose -p klcn-s0 -f infra/compose.yaml up -d --build --wait --wait-timeout 180
          sudo chown "$(docker compose -p klcn-s0 -f infra/compose.yaml exec -T api id -u)" "$IDENTITY_MAIL_DIRECTORY"
          docker compose -p klcn-s0 -f infra/compose.yaml exec -T api sh -c 'test -w "$Identity__DevelopmentMailDirectory"'
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5080/api/v1/catalog/vaccines > /tmp/catalog.json; then
              python3 -c 'import json; assert json.load(open("/tmp/catalog.json"))["source"] == "database"'
              exit $?
            fi
            sleep 2
          done
          exit 1
      - run: dotnet test backend/TiemChung.slnx --configuration Release
      - name: X2.2.1 receipt history client and SQL tests (cross-platform ViewModels)
        run: dotnet test apps/windows.tests/TiemChung.Windows.Tests.csproj --configuration Release --filter "FullyQualifiedName~InventoryReceiptHistory"
      - name: RF-02B1 Catalog client state regression
        run: dotnet test apps/windows.tests/TiemChung.Windows.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~CatalogClientTests"
      - name: RF-04B1 cashier client and SQL reconciliation
        run: dotnet test apps/windows.tests/TiemChung.Windows.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Payment"
      - name: AUTHZ-R1 capability and account-role client regression
        run: dotnet test apps/windows.tests/TiemChung.Windows.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~EmployeeAccessClientTests"
      - name: RF-05B clinical and vaccination client and SQL regression
        run: dotnet test apps/windows.tests/TiemChung.Windows.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Clinical|FullyQualifiedName~Vaccination"
      - name: RF-05E reminder email client states and reconciliation
        run: dotnet test apps/windows.tests/TiemChung.Windows.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~ReminderClientTests"
      - name: RF-05F appointment lifecycle client and SQL regression
        run: dotnet test apps/windows.tests/TiemChung.Windows.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Appointment"
      - name: Repeat migration without resetting data
        run: docker compose -p klcn-s0 -f infra/compose.yaml run --rm migrate
      - name: Build SQL-principal acceptance (not executed without approved provisioning)
        run: dotnet build backend/tests/TiemChung.BoundaryAcceptance/TiemChung.BoundaryAcceptance.csproj --configuration Release
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test src/api/*.test.js
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Launcher self-test (no Docker or database)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/devtools/VAC.SelfTest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet build apps/windows/TiemChung.Desktop.csproj --configuration Release
      - name: WPF interaction and rendering regressions
        run: dotnet test apps/windows.ui.tests/TiemChung.Windows.Ui.Tests.csproj --configuration Release
